<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFZ Systems</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Tahoma,"Segoe UI","Geeza Pro",Arial,sans-serif;background:#0b3d4a;background:linear-gradient(160deg,#0a6e5c 0%,#0b3d4a 60%,#08222b 100%);color:#1d2b30;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center;color:#fff;margin-bottom:18px}
.brand{font-size:22px;font-weight:bold;letter-spacing:.5px}
.brand span{color:#7fe3c8}
.lang{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:18px;padding:6px 14px;font-size:14px;cursor:pointer}
.card{width:100%;max-width:420px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:24px 22px;text-align:center}
.ok{width:64px;height:64px;border-radius:50%;background:#e3f4ef;color:#0a6e5c;font-size:36px;line-height:64px;margin:0 auto 12px}
h1{font-size:20px;margin:0 0 6px;color:#0a6e5c}
p{font-size:14px;color:#4a5a60;margin:0 0 16px;line-height:1.7}
table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}
td{padding:9px 4px;border-bottom:1px solid #eef2f3}
td.k{color:#6b7b80;text-align:start}
td.v{text-align:end;direction:ltr;unicode-bidi:plaintext}
.btn{width:100%;height:46px;margin-top:12px;border:0;border-radius:8px;background:#0a6e5c;color:#fff;font-size:16px;cursor:pointer}
.btn.out{background:#fff;color:#a12622;border:1px solid #e3b5b3}
.foot{color:rgba(255,255,255,.75);font-size:12px;margin-top:18px;text-align:center}
.hide{display:none}
</style>
</head>
<body>
<div class="top">
  <div class="brand">AFZ <span>Systems</span></div>
  <button type="button" class="lang" id="langBtn" onclick="toggleLang()">English</button>
</div>

<div class="card">
  <div class="ok">&#10003;</div>
  <h1 data-t="title">تم الاتصال بنجاح</h1>
  <p data-t="sub">أنت الآن متصل بالإنترنت. يمكنك إغلاق هذه الصفحة.</p>

  <FORM name=LoginInfoForm>
    <INPUT type="hidden"  name="HiddenLoginTime" size=25 value="">
    <INPUT type="hidden"  name="HiddenUserName" size=25 value="">
    <INPUT type="hidden"  name="HiddenUserIP"  value="" >
    <INPUT type="hidden"  name="anonymous" value="DISABLE">
    <INPUT type="hidden"  name="anonymousurl" value="">
  </FORM>
  <table>
    <tr id="rowUser"><td class="k" data-t="user">اسم المستخدم</td><td class="v" id="vUser"></td></tr>
    <tr id="rowIp"><td class="k" data-t="ip">عنوان IP</td><td class="v" id="vIp"></td></tr>
    <tr id="rowTime"><td class="k" data-t="time">وقت الدخول</td><td class="v" id="vTime"></td></tr>
  </table>

  <button type="button" class="btn hide" id="goBtn" onclick="goOn()" data-t="go">متابعة إلى الصفحة المطلوبة</button>

  <FORM name=LogoutForm method=post action="http://10.0.255.1:8080/logout" target="logoutFrame" onsubmit="return doLogout()">
    <button type="submit" name="submit" class="btn out" id="outBtn" data-t="logout">تسجيل الخروج</button>
  </FORM>
  <iframe name="logoutFrame" style="display:none" title="logout"></iframe>
</div>

<div class="foot">© AFZ Systems</div>

<script>
var T = {
  ar: {title:"تم الاتصال بنجاح", sub:"أنت الآن متصل بالإنترنت. يمكنك إغلاق هذه الصفحة.",
       user:"اسم المستخدم", ip:"عنوان IP", time:"وقت الدخول", go:"متابعة إلى الصفحة المطلوبة",
       logout:"تسجيل الخروج", other:"English"},
  en: {title:"Connected successfully", sub:"You are now connected to the internet. You may close this page.",
       user:"Username", ip:"IP address", time:"Login time", go:"Continue to the requested page",
       logout:"Log out", other:"العربية"}
};
var lang = "ar";
try { if (localStorage.getItem("afz_lang") === "en") lang = "en"; } catch (e) {}

function applyLang() {
  var t = T[lang], els = document.querySelectorAll("[data-t]");
  for (var i = 0; i < els.length; i++) els[i].innerHTML = t[els[i].getAttribute("data-t")];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.getElementById("langBtn").innerHTML = t.other;
  showTime();
}
function toggleLang() {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("afz_lang", lang); } catch (e) {}
  applyLang();
}
function fill(row, cell, val) {
  if (val) document.getElementById(cell).textContent = val;
  else document.getElementById(row).style.display = "none";
}
function showTime() {
  var v = document.LoginInfoForm.HiddenLoginTime.value;
  if (/^\d{9,}$/.test(v)) {
    try { v = new Date(parseInt(v, 10) * 1000).toLocaleString(lang === "ar" ? "ar" : "en-GB"); } catch (e) {}
  }
  fill("rowTime", "vTime", v);
}
function redirectUrl() {
  var u = document.location.href.replace("%3A%2F%2F", "://").replace(/%2F/gi, "/");
  var i = u.indexOf("RedirectUrl=");
  if (i < 0) return "";
  var r = u.substr(i + 12, 200);
  if (!r) return "";
  return r.indexOf("http") === 0 ? r : "http://" + r;
}
function goOn() { var r = redirectUrl(); if (r) top.location.href = r; }

function stored(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function urlParam(names) {
  var q = document.location.search.substr(1).split("&");
  for (var i = 0; i < q.length; i++) {
    var kv = q[i].split("=");
    for (var j = 0; j < names.length; j++)
      if (kv[0].toLowerCase() === names[j]) return decodeURIComponent(kv[1] || "");
  }
  return "";
}
// The router's logout reply page does not exist in a custom page set:
// post the logout in a hidden frame, then show our own logout page.
function doLogout() {
  document.getElementById("outBtn").disabled = true;
  try { localStorage.removeItem("afz_user"); localStorage.removeItem("afz_time"); } catch (e) {}
  setTimeout(function () { top.location.href = "http://10.0.255.1:8080/logout.html"; }, 1500);
  return true;
}

var f = document.LoginInfoForm;
// Values the router injects (built-in page) win; otherwise use what the login page saved
if (!f.HiddenUserName.value) f.HiddenUserName.value = urlParam(["username", "user"]) || stored("afz_user");
if (!f.HiddenUserIP.value) f.HiddenUserIP.value = urlParam(["userip", "ip"]);
if (!f.HiddenLoginTime.value) f.HiddenLoginTime.value = stored("afz_time");
fill("rowUser", "vUser", f.HiddenUserName.value);
fill("rowIp", "vIp", f.HiddenUserIP.value);
if (redirectUrl()) document.getElementById("goBtn").className = "btn";
applyLang();
</script>
</body>
</html>
