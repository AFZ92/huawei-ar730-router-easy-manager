name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  harness:
    name: harness (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # The harness deliberately exercises Arabic UI text; GitHub's Windows
      # PowerShell console otherwise defaults to a non-Unicode code page.
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install application dependencies
        run: python -m pip install -r requirements.txt

      - name: Qt application flow
        run: python harness/run_qt_test.py

      - name: Release update logic
        run: python harness/run_distribution_test.py

  compile:
    name: byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Verify the application compiles on the minimum supported version
        run: python -m compileall -q ar730_manager.py harness
